<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloading cv.pdf | Brent Liam Emmanuel L. Go</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #11151A;
      color: #F5F3ED;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #171C23;
      border: 1px solid rgba(245, 243, 237, 0.15);
      padding: 36px 40px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #FB8B24;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 500;
      color: #F5F3ED;
    }
    p {
      margin: 0 0 20px;
      color: #A0AAB4;
      font-size: 14px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: #FB8B24;
      color: #11151A;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: monospace;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #E36414;
    }
    .subtext {
      margin-top: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">[ OFFICIAL CV DOCUMENT ]</div>
    <h1>Downloading cv.pdf</h1>
    <p>Your resume file is downloading directly to your device.</p>
    <a id="download-link" href="/cv.pdf" download="cv.pdf" class="btn">
      DOWNLOAD CV.PDF
    </a>
    <div class="subtext">Brent Liam Emmanuel L. Go &bull; Curriculum Vitae</div>
  </div>

  <script>
    // In this top-level tab (outside iframe restrictions), the download is natively permitted
    (function() {
      try {
        const link = document.createElement('a');
        link.href = '/cv.pdf';
        link.download = 'cv.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error('Auto download error:', err);
      }
    })();
  </script>
</body>
</html>
